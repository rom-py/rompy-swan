name: SWAN docker image

# Builds the SWAN runtime images in docker/ and publishes them to
# ghcr.io/rom-py/swan, one tag per release listed in docker/releases.txt; latest
# points to the last release in the file.
#
# Every image must run workspaces generated by rompy-swan (docker/test_image.py)
# before it is pushed. Pull requests only build and test.
#
# Pushes to main and new tags publish the releases that are not published yet.
# Changes to docker/ and manual runs rebuild all of them.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rom-py/swan

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the images changed
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "images=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "${{ github.sha }}" \
              | grep -qE '^(docker/|\.github/workflows/docker\.yml$)'; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List the images to build
        id: builds
        env:
          IMAGES_CHANGED: ${{ steps.changed.outputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          releases = [
              line.split()
              for line in open("docker/releases.txt")
              if line.strip() and not line.startswith("#")
          ]
          rebuild = os.environ["IMAGES_CHANGED"] == "true"
          builds = []
          for index, (version, sha256) in enumerate(releases):
              image = f"{os.environ['IMAGE']}:{version}"
              published = subprocess.run(
                  ["docker", "manifest", "inspect", image], capture_output=True
              ).returncode == 0
              if rebuild or not published:
                  latest = index == len(releases) - 1
                  builds.append(
                      {
                          "version": version,
                          "sha256": sha256,
                          "tags": f"{version},latest" if latest else version,
                      }
                  )
          print(f"builds={json.dumps(builds)}")
          PY

  build:
    needs: matrix
    if: needs.matrix.outputs.builds != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.matrix.outputs.builds) }}
    name: build ${{ matrix.build.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rompy-swan
        run: pip install ".[dev]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: swan:test
          build-args: |
            SWAN_VERSION=${{ matrix.build.version }}
            SWAN_SHA256=${{ matrix.build.sha256 }}
          cache-from: type=gha,scope=${{ matrix.build.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.build.version }}

      - name: Run rompy-swan workspaces in the image
        run: python docker/test_image.py swan:test

      - name: Image tags
        id: tags
        run: |
          tags=""
          for tag in $(echo "${{ matrix.build.tags }}" | tr ',' ' '); do
            tags="${tags}${IMAGE}:${tag},"
          done
          echo "tags=${tags%,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SWAN_VERSION=${{ matrix.build.version }}
            SWAN_SHA256=${{ matrix.build.sha256 }}
          cache-from: type=gha,scope=${{ matrix.build.version }}
