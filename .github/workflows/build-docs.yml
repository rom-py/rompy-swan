name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rompy-swan
        uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install package with docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,test]"
          # Temporary, until rompy's docs branch is merged and released: the API
          # pages include members inherited from rompy, whose docstrings it fixes.
          pip install "rompy @ git+https://github.com/rom-py/rompy.git@docs-restructure"

      # The examples read data from tests/data, downloaded from rompy-test-data
      - name: Download the example data
        run: python -c "import tests.conftest"

      # The notebooks are rendered on the rompy-notebooks site; the Tutorial and
      # Examples pages list them from the inventory that site publishes.
      - name: Check the shared docs configuration
        run: rompy-docs check -f mkdocs.yml

      # Strict: broken links, missing API targets and failing examples fail the build
      - name: Build documentation
        run: properdocs build --strict -f mkdocs.yml

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: properdocs gh-deploy --force -f mkdocs.yml
